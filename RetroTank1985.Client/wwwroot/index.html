<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Retro Tank 1985 (Battle City NES WASM)</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body class="retro-body">
    <div id="app">
        <div style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0c0d12;color:#f1c40f;font-family:'Press Start 2P',monospace;text-align:center;padding:1rem;">
            <div style="font-size:1.4rem;margin-bottom:1.5rem;text-shadow:0 0 10px rgba(241,196,15,0.5);">RETRO TANK 1985</div>
            <div style="font-size:0.75rem;color:#94a3b8;margin-bottom:2rem;font-family:'Rajdhani',sans-serif;letter-spacing:1px;">LOADING NES APU & BLANK CARTRIDGE...</div>
            <div style="width:40px;height:40px;border:4px solid #232938;border-top-color:#f1c40f;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;background:#e74c3c;color:#ffffff;padding:0.6rem 1.25rem;box-shadow:0 -1px 4px rgba(0,0,0,0.4);z-index:1000;font-family:'Rajdhani',sans-serif;">
        An unhandled error has occurred in WebAssembly runtime.
        <a href="" class="reload" style="color:#ffffff;text-decoration:underline;margin-left:1rem;font-weight:bold;">Reload</a>
        <a class="dismiss" style="cursor:pointer;position:absolute;right:1rem;top:0.5rem;font-weight:bold;">🗙</a>
    </div>

    <script>
        window.__IS_STANDALONE_WASM__ = true;
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/nes-synth.js"></script>
</body>

</html>
